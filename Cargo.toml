[package]
name = "git-worktree-manager"
version = "0.1.7"
edition = "2021"
rust-version = "1.88"
default-run = "gw"
description = "Lean git worktree manager with AI coding-assistant integration"
license = "BSD-3-Clause"
repository = "https://github.com/DaveDev42/git-worktree-manager"
homepage = "https://github.com/DaveDev42/git-worktree-manager"
keywords = ["git", "worktree", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"
console = "0.16"
dialoguer = "0.12"
dirs = "6"
flate2 = "1"
pathdiff = "0.2"
rayon = "1.12"
ratatui = "0.30"
regex = "1"
self-replace = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
thiserror = "2"
walkdir = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
filetime = "0.2"
predicates = "3"
serial_test = "3"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"

# cargo-binstall support
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/gw-{ target }{ archive-suffix }"
bin-dir = "gw{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
